<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incident explorer</title><link rel="stylesheet" href="/style.css"></head><body>
<header><span>SUPPORT OPERATIONS · FICTIONAL DATA</span><h1>Incident explorer</h1><p>Find patterns. Understand the details.</p></header>
<main><section id="results"><form id="filters"><label class="search">Search incidents<input name="q" type="search" placeholder="ID, title, or description"></label><div id="choices"></div><div class="toolbar"><label>Opened from (UTC)<input name="from" type="date"></label><label>Opened through (UTC)<input name="to" type="date"></label><label>Sort by<select name="sort"><option value="openedAt">Opened date</option><option value="severity">Severity</option></select></label><label>Order<select name="direction"><option value="desc">Highest / newest first</option><option value="asc">Lowest / oldest first</option></select></label><label>Rows per page<select name="size"><option>25</option><option>50</option></select></label><button type="button" id="clear">Clear all</button></div></form>
<section class="views" aria-label="View management"><label>View name<input id="view-name" maxlength="80"></label><button id="save">Save view</button><label>Saved views<select id="saved" aria-label="Saved views"><option value="">Choose a view</option></select></label><button id="open-view">Open view</button><button id="delete-view">Delete view</button></section>
<p id="active"></p><p id="message" role="status" aria-live="polite"></p><button id="retry" hidden>Retry</button>
<div id="summary" class="summary"></div><details id="chart"><summary>Incidents opened by UTC day · chart and counts</summary><div id="days"></div></details>
<div class="table-heading"><h2>Matching incidents</h2><a id="export" href="/api/export">Export all as CSV</a></div><p id="empty" hidden>No incidents match. Adjust your selections or clear all.</p><div class="table-scroll" tabindex="0" role="region" aria-label="Incident table; scroll horizontally for all columns"><table><thead><tr><th>Incident</th><th>Service</th><th>Severity</th><th>Status</th><th>Opened (UTC)</th></tr></thead><tbody id="rows"></tbody></table></div><nav aria-label="Result pages"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></nav></section>
<section id="detail" hidden><button id="back">Back to results</button><h2 id="detail-title" tabindex="-1"></h2><dl id="fields"></dl></section></main><script type="module" src="/app.js"></script></body></html>
